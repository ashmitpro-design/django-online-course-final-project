{% extends 'onlinecourse/base.html' %}{% block title %}Sign in{% endblock %}{% block content %}<div class="card mx-auto" style="max-width: 30rem"><div class="card-body"><h1 class="h3">Learner sign in</h1>{% if form.errors %}<div class="alert alert-danger">Username or password is incorrect.</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" type="submit">Sign in</button></form></div></div>{% endblock %}
