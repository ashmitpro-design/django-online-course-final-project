{% extends 'onlinecourse/base.html' %}{% block title %}Courses{% endblock %}{% block content %}
<h1 class="mb-4">Available courses</h1><div class="row g-3">{% for course in courses %}<div class="col-md-6"><article class="card h-100"><div class="card-body"><h2 class="h4">{{ course.name }}</h2><p>{{ course.description|truncatewords:30 }}</p><a class="btn btn-primary" href="{% url 'onlinecourse:course_details' course.id %}">View course</a></div></article></div>{% empty %}<p>No courses are available yet.</p>{% endfor %}</div>{% endblock %}
