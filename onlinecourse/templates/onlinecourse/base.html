<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Course{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="{% url 'onlinecourse:course_list' %}">OnlineCourse</a><div class="d-flex align-items-center gap-3">{% if user.is_authenticated %}<span class="text-white">{{ user.username }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Sign out</button></form>{% else %}<a class="text-white" href="{% url 'login' %}">Sign in</a>{% endif %}<a class="text-white" href="/admin/">Admin</a></div></div></nav>
<main class="container py-4">{% if messages %}{% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</main></body></html>
